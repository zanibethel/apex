name: Scheduled notices isolated PostgreSQL verification
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110065000_apex_scheduled_storefront_notices.sql'
      - 'tests/notice-migrations/**'
      - '.github/workflows/notice-migrations.yml'
  workflow_dispatch:
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notices_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notices_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: notices_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Seed disposable auth and supplier fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f tests/notice-migrations/bootstrap.sql
      - name: Install notice schema and secured RPCs
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110065000_apex_scheduled_storefront_notices.sql
      - name: Verify public feed, scheduling, role isolation, stale writes and audit
        run: psql -X -v ON_ERROR_STOP=1 -f tests/notice-migrations/assertions.sql
