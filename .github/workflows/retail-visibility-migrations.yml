name: Retail visibility migration verification
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110024500_apex_public_product_tags_v1.sql'
      - 'supabase/migrations/20261110032000_apex_retail_minimum_listing_fields.sql'
      - 'supabase/migrations/20261110040000_apex_admin_retail_product_visibility_restrictions.sql'
      - 'supabase/migrations/20261113234500_apex_content_neutral_retail_display.sql'
      - 'supabase/migrations/20261114010000_apex_retail_cart_quote_bridge.sql'
      - 'supabase/migrations/20261114022000_apex_private_retail_order_hold_engine.sql'
      - 'supabase/migrations/20261114031000_apex_retail_order_delivery_atomic_boundary.sql'
      - 'supabase/migrations/20261114041000_apex_retail_order_hold_expiry_schedule.sql'
      - 'supabase/migrations/20261114052000_apex_private_retail_checkout_execution_role.sql'
      - 'supabase/migrations/20261114061000_apex_retail_checkout_connection_identity.sql'
      - 'src/lib/checkout/retail-restricted-db-probe-v1.mjs'
      - 'scripts/test-retail-postgres-connection.mjs'
      - 'tests/retail-visibility-migrations/**'
      - '.github/workflows/retail-visibility-migrations.yml'
  workflow_dispatch:
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retail_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: retail_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create disposable retail, auth and supplier fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f tests/retail-visibility-migrations/bootstrap.sql
      - name: Apply product-tag migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110024500_apex_public_product_tags_v1.sql
      - name: Apply three-field publishing migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110032000_apex_retail_minimum_listing_fields.sql
      - name: Apply admin visibility restriction migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110040000_apex_admin_retail_product_visibility_restrictions.sql
      - name: Apply content-neutral retail display migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261113234500_apex_content_neutral_retail_display.sql
      - name: Verify anonymous and supplier visibility, admin restrictions, audited changes and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/retail-visibility-migrations/assertions.sql
      - name: Install nonpayable retail-cart quote RPC
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114010000_apex_retail_cart_quote_bridge.sql
      - name: Verify retail cart pricing, inventory, cross-store, admin holds, gate and privileges
        run: psql -X -v ON_ERROR_STOP=1 -f tests/retail-visibility-migrations/cart-quote-assertions.sql

      - name: Apply default-OFF private atomic order hold engine
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114022000_apex_private_retail_order_hold_engine.sql
      - name: Verify order snapshots, stock rollback, replay, admin holds, cancellation, expiry and private RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/retail-visibility-migrations/private-order-holds.sql
      - name: Verify two-session hold replay and stock race
        run: bash tests/retail-visibility-migrations/private-order-concurrency.sh
      - name: Apply private encrypted retail delivery boundary with default-OFF gate
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114031000_apex_retail_order_delivery_atomic_boundary.sql
      - name: Verify delivery is sealed atomically or stock reservation rolls back
        run: psql -X -v ON_ERROR_STOP=1 -f tests/retail-visibility-migrations/private-delivery-envelope.sql
      - name: Apply scheduled unpaid-order expiry (synthetic pg_cron)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114041000_apex_retail_order_hold_expiry_schedule.sql
      - name: Verify one-minute cleanup job and private permissions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/retail-visibility-migrations/expiry-schedule.sql
      - name: Install default-locked retail checkout executor role
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114052000_apex_private_retail_checkout_execution_role.sql
      - name: Verify scoped executor, atomic order, replay and expiry as real role
        run: psql -X -v ON_ERROR_STOP=1 -f tests/retail-visibility-migrations/executor-one-connection-order.sql
      - name: Apply isolated NOLOGIN checkout application identity
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261114061000_apex_retail_checkout_connection_identity.sql
      - name: Verify role noninheritance, SET LOCAL ROLE and checkout gate
        run: psql -X -v ON_ERROR_STOP=1 -f tests/retail-visibility-migrations/connection-identity.sql
      - name: Install pinned node-postgres runtime for isolated integration
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enable dedicated login and hold engine in disposable database ONLY
        run: |
          test "$PGDATABASE" = "retail_test"
          psql -X -v ON_ERROR_STOP=1 -c "alter role apex_retail_checkout_app login password 'postgres';"
          psql -X -v ON_ERROR_STOP=1 -c "update apex_internal.retail_order_engine_gate set enabled=true where singleton=true;"
      - name: Prove real restricted Node role diagnostics, PostgreSQL transaction and encrypted order hold
        env:
          PGUSER: apex_retail_checkout_app
          CI: "true"
        run: node scripts/test-retail-postgres-connection.mjs
      - name: Verify actual Node order replays once and expiry restores stock
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          declare v_id uuid;
          begin
            select id into v_id from apex_internal.retail_order_holds
              where request_id='ea1f01bf-85b0-4d78-8ed8-af3eb620eae1';
            if v_id is null or
              (select count(*) from apex_internal.retail_order_holds
               where request_id='ea1f01bf-85b0-4d78-8ed8-af3eb620eae1')<>1 or
              (select count(*) from apex_internal.retail_order_hold_lines
               where order_id=v_id)<>1 or
              (select count(*) from apex_internal.retail_order_delivery_envelopes
               where order_id=v_id)<>1 or
              (select quantity_reserved from public.inventory_items
               where product_id='50000000-0000-4000-8000-000000000001')<>1
            then raise exception 'Node checkout transaction did not persist exactly once';end if;
            update apex_internal.retail_order_holds
              set created_at=now()-interval '1 hour',
                  expires_at=now()-interval '1 minute'
              where id=v_id;
            if apex_internal.expire_due_retail_order_holds(20)<>1 then
              raise exception 'Node checkout test hold did not expire';end if;
            if (select quantity_reserved from public.inventory_items
               where product_id='50000000-0000-4000-8000-000000000001')<>0
            then raise exception 'Stock was not released';end if;
          end $verify$;
          SQL
      - name: Restore test-only identity and order gate
        if: always()
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "update apex_internal.retail_order_engine_gate set enabled=false where singleton=true;" || true
          psql -X -v ON_ERROR_STOP=1 -c "alter role apex_retail_checkout_app nologin;" || true
