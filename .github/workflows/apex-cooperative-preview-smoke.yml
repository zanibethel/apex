name: Apex to CoOperative preview smoke
on:
  push:
    branches:
      - feat/apex-cooperative-embedded-chat-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-service-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify authenticated CoOperative response from Apex preview
        env:
          APEX_PREVIEW_CHAT_URL: https://apex-git-feat-apex-cooperative-embe-9d288a-zanibethels-projects.vercel.app/api/assistant
        run: |
          set -euo pipefail
          for attempt in $(seq 1 3); do
            raw="$(curl --silent --show-error --max-time 20 \
              --write-out '\nSTATUS:%{http_code}' \
              -X POST "$APEX_PREVIEW_CHAT_URL" \
              -H 'Content-Type: application/json' \
              --data '{"message":"hello"}' || true)"
            if RESPONSE="$raw" node -e '
              const raw=process.env.RESPONSE||"";
              const marker=raw.lastIndexOf("\nSTATUS:");
              const status=marker>=0?raw.slice(marker+8).trim():"unknown";
              let data;try{data=JSON.parse(marker>=0?raw.slice(0,marker):raw)}catch{data={}}
              console.log("Preview response status="+status+"; source="+(data.source||"none"));
              if(status!=="200"||data.source!=="cooperative-code-v1"||
                typeof data.answer!=="string"||!data.answer.includes("approved Apex")||
                !Array.isArray(data.items)||data.items.length!==0)process.exit(1);
              console.log("Confirmed CoOperative reply, no public catalog records leaked.");
            '; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Preview returned no verified CoOperative answer; local fallback and protected deployments do not pass."
          exit 1
