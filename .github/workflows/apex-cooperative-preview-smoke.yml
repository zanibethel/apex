name: Apex to CoOperative preview smoke
on:
  push:
    branches:
      - feat/apex-cooperative-embedded-chat-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-service-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Apex preview talks to CoOperative without paid model calls
        env:
          APEX_PREVIEW_CHAT_URL: https://apex-git-feat-apex-cooperative-embe-9d288a-zanibethels-projects.vercel.app/api/assistant
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            raw="$(curl --silent --show-error --max-time 20 \
              -X POST "$APEX_PREVIEW_CHAT_URL" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data '{"message":"hello"}' || true)"
            if RESPONSE="$raw" node -e '
              const raw=process.env.RESPONSE||"";
              let v; try {v=JSON.parse(raw);}catch{process.exit(1)}
              if(v.source!=="cooperative-code-v1"||typeof v.answer!=="string"||
                 !v.answer.includes("approved Apex")||
                 !Array.isArray(v.items)||v.items.length!==0)process.exit(1);
              console.log("Cross-service CoOperative reply confirmed; no products or user data returned.");
            '; then
              exit 0
            fi
            echo "Preview remote route not verified (attempt $attempt of 10)."
            sleep 12
          done
          echo "::error::Apex preview never returned a confirmed CoOperative reply. Check preview protection and server-only env wiring; local fallback is not a pass."
          exit 1
