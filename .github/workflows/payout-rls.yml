name: Payout RLS isolated Postgres verification
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/payout-rls/**'
      - 'database/sql/apex_private_checkout_product_snapshot_REVIEW_ONLY.sql'
      - 'database/sql/apex_public_sold_out_catalog_REVIEW_ONLY.sql'
      - 'database/sql/apex_verified_soldout_release_activation_REVIEW_ONLY.sql'
      - 'database/sql/apex_btcpay_*_REVIEW_ONLY.sql'
      - '.github/workflows/payout-rls.yml'
  workflow_dispatch:
jobs:
  isolated-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apex_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: apex_test
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated auth fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/bootstrap.sql
      - name: Apply catalog and payout migrations to disposable Postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029233701_apex_initial_catalog_readonly.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030222500_payout_reporting_readonly.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030233000_multi_split_draft_rpc.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030234500_payout_recipient_admin.sql
      - name: Verify row isolation and read-only grants
        run: bash tests/payout-rls/check.sh
      - name: Verify atomic draft saving and denial cases
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/draft-rpc.sql
      - name: Verify recipient directory authorization
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/recipient-admin.sql
      - name: Verify direct draft writes denied
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/direct-write-denial.sql
      - name: Verify invalid payout drafts are rejected
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/draft-rpc-negative.sql
      - name: Verify active payout rule immutability
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/non-draft-immutable.sql
      - name: Verify concurrent draft versions
        run: bash tests/payout-rls/concurrent-versions.sh
      - name: Apply private admin quote snapshot fixture (disposable database only)
        run: psql -v ON_ERROR_STOP=1 -f database/sql/apex_private_checkout_product_snapshot_REVIEW_ONLY.sql
      - name: Verify protected snapshot returns private price and stock but never checkout rights
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/private-checkout-snapshot.sql
      - name: Create synthetic public gallery approval fixture (disposable only)
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/public-soldout-fixture.sql
      - name: Apply review-only public sold-out projection to disposable Postgres
        run: psql -v ON_ERROR_STOP=1 -f database/sql/apex_public_sold_out_catalog_REVIEW_ONLY.sql
      - name: Verify gate denial, approved-only display, and no private fields
        run: psql -v ON_ERROR_STOP=1 -f tests/payout-rls/public-soldout-release.sql
      - name: Prepare independently authorized Sold Out fixture (disposable)
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/verified-soldout-release-fixture.sql
      - name: Install staged shared release predicate and private verdict (disposable)
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_verified_soldout_release_activation_REVIEW_ONLY.sql
      - name: Verify gated Sold Out publication, holds, approval revocation and anonymous isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/verified-soldout-release-lifecycle.sql
      - name: Install narrow admin category publication RPC and audit
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261103044500_apex_admin_category_publication.sql
      - name: Verify category ownership, audit, direct-write denial and release gate isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/admin-category-publication.sql
      - name: Install admin-only category creation RPC (disposable)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261103073000_apex_admin_category_creation.sql
      - name: Verify private category creation, duplicates, audit and public isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/admin-category-create.sql
      - name: Install verified admin category rename RPC (disposable)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261103132000_apex_admin_category_rename.sql
      - name: Verify category rename role isolation, stable IDs, audits and public gate
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/admin-category-rename.sql
      - name: Install held-only private checkout order journal
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261103150000_apex_private_checkout_order_journal.sql
      - name: Verify immutable order identities, cross-role isolation, and no provider actions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/private-checkout-order-journal.sql
      - name: Install strict private admin-only cart validation RPC (disposable)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261103170000_apex_private_cart_validation.sql
      - name: Verify live price, stock, role scope and denied checkout
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/admin-private-cart-validation.sql
      - name: Load isolated BTCPay receipt journal (no production database)
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_receipt_journal_REVIEW_ONLY.sql
      - name: Load isolated BTCPay order-status fixture
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_order_status_REVIEW_ONLY.sql
      - name: Load review-only admin split activation fixture
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_split_activation_REVIEW_ONLY.sql
      - name: Verify only eligible draft split candidates can be reviewed
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-split-activation-gate.sql
      - name: Prove competing administrator reviews serialize
        run: bash tests/payout-rls/btcpay-concurrent-split-reviews.sh
      - name: Install disposable test invoice-writer and split-sync hold barrier
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_invoice_sync_hold_REVIEW_ONLY.sql
      - name: Verify held rule immutability, rejected invoices and stale review
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-invoice-sync-hold.sql
      - name: Prove invoice writer blocks on same store lock during split hold
        run: bash tests/payout-rls/btcpay-invoice-sync-hold-concurrency.sh

      - name: Install disposable append-only BTCPay reconciliation recovery audit
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_sync_recovery_audit_REVIEW_ONLY.sql
      - name: Verify idempotent recovery, incident revocation and permanent checkout hold
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-sync-recovery-audit.sql
      - name: Install disposable two-admin checkout-release review fixture
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_dual_control_release_REVIEW_ONLY.sql
      - name: Verify independent admin cosign, audit pinning, stale evidence denial and held checkout
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-dual-control-release.sql
      - name: Install disposable one-shot journal registration permit
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_atomic_resume_fence_REVIEW_ONLY.sql
      - name: Verify single-use, automatic revoke and role restrictions
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-atomic-resume-fence.sql
      - name: Prove two-session administrator and invoice-writer races
        run: bash tests/payout-rls/btcpay-atomic-resume-concurrency.sh
      - name: Install disposable durable pre-POST BTCPay invoice intent journal
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_external_prepost_intent_REVIEW_ONLY.sql
      - name: Verify reservation-before-POST, replay denial and append-only uncertainty audit
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-external-prepost-intent.sql
      - name: Load immutable store-to-Greenfield bindings in disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_trusted_pg_worker_REVIEW_ONLY.sql
      - name: Install supplier-scoped credential fingerprint bindings (disposable only)
        run: psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_supplier_credentials_REVIEW_ONLY.sql
      - name: Prepare two separately authorized worker fixture stores
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-trusted-worker-setup.sql
      - name: Provision least-privilege disposable payment-worker login
        run: |
          set -euo pipefail
          worker_password="$(openssl rand -hex 32)"
          echo "::add-mask::$worker_password"
          psql -X -v ON_ERROR_STOP=1 -v "worker_password=$worker_password" -f database/sql/apex_btcpay_test_restricted_worker_role_REVIEW_ONLY.sql
          echo "APEX_BTCPAY_TEST_WORKER_PASSWORD=$worker_password" >> "$GITHUB_ENV"
      - name: Provision two independent disposable recovery operator logins
        run: |
          set -euo pipefail
          requester_password="$(openssl rand -hex 32)"
          reviewer_password="$(openssl rand -hex 32)"
          echo "::add-mask::$requester_password"
          echo "::add-mask::$reviewer_password"
          psql -X -v ON_ERROR_STOP=1 -v "requester_password=$requester_password" -v "reviewer_password=$reviewer_password" -f database/sql/apex_btcpay_test_dual_operator_recovery_REVIEW_ONLY.sql
          echo "APEX_BTCPAY_TEST_RECOVERY_REQUESTER_PASSWORD=$requester_password" >> "$GITHUB_ENV"
          echo "APEX_BTCPAY_TEST_RECOVERY_REVIEWER_PASSWORD=$reviewer_password" >> "$GITHUB_ENV"
      - name: Deny forged and shared-identity recovery access
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-operator-recovery-grants.sql
      - name: Deny direct reads, writes and privilege elevation for worker login
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-restricted-worker-role.sql
      - name: Reject cross-supplier, revoked and forged payment credentials
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-supplier-credential-denials.sql
      - name: Verify worker logs in as non-superuser over real PostgreSQL
        run: |
          set -euo pipefail
          actual="$(PGUSER=apex_test_invoice_worker PGPASSWORD="$APEX_BTCPAY_TEST_WORKER_PASSWORD" psql -X -At -v ON_ERROR_STOP=1 -c 'select current_user')"
          test "$actual" = "apex_test_invoice_worker"
      - name: Verify real PostgreSQL-backed worker with simulated provider replies
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          APEX_BTCPAY_EPHEMERAL: "true"
          APEX_BTCPAY_TEST_NETWORK: regtest
        run: node scripts/btcpay-ephemeral-trusted-pg-worker-check.mjs
      - name: Verify durable single-attempt recovery and permanent holds
        run: psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/btcpay-trusted-worker-results.sql
      - name: Verify synthetic uncertain-outcome reconciliation requires two distinct operator logins
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          APEX_BTCPAY_EPHEMERAL: "true"
          APEX_BTCPAY_TEST_NETWORK: regtest
        run: node scripts/btcpay-ephemeral-operator-recovery-check.mjs
