name: BTCPay ephemeral upstream regtest readiness

# Runs only synthetic BTC regtest in a disposable GitHub-hosted runner.
# No GitHub repository secrets, production VPS, customer wallets or real coins.
on:
  pull_request:
    paths:
      - ".github/workflows/btcpay-upstream-regtest.yml"
      - "scripts/btcpay-local-doctor.mjs"
      - "tests/btcpay-local-doctor.test.mjs"
      - "scripts/btcpay-ephemeral-*.mjs"
      - "src/lib/payments/prism-payout-reliability.mjs"
      - "tests/prism-payout-reliability.test.mjs"
      - "tests/payout-rls/prism-ephemeral-test-store-setting.sql"
      - "scripts/install_prism_regtest.py"
      - "tests/prism-install-safety.test.py"
      - "database/sql/apex_btcpay_*_REVIEW_ONLY.sql"
      - "tests/payout-rls/btcpay-live-journal-*.sql"
      - "tests/btcpay-ephemeral-*.test.mjs"
      - "docs/BTCPAY_EPHEMERAL_SIGNED_WEBHOOK_20261101.md"
      - "docs/BTCPAY_LOCAL_FIRST_STRATEGY_20261031.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btcpay-ephemeral-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upstream-local-regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apex_journal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apex_journal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: apex_journal_ci
      UPSTREAM_REF: 381ad1f0ac32fb011163239fcacdde1e6f7538b9
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check synthetic environment prerequisites
        run: |
          node --version
          dotnet --version
          docker compose version
      - name: Fetch a reviewed, pinned official BTCPay source revision
        run: |
          git init "${RUNNER_TEMP}/btcpayserver"
          git -C "${RUNNER_TEMP}/btcpayserver" remote add origin https://github.com/btcpayserver/btcpayserver.git
          git -C "${RUNNER_TEMP}/btcpayserver" fetch --depth 1 origin "${UPSTREAM_REF}"
          git -C "${RUNNER_TEMP}/btcpayserver" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/btcpayserver" rev-parse HEAD)" = "${UPSTREAM_REF}"
      - name: Fail closed unless upstream dev configuration uses loopback and Bitcoin regtest
        run: node scripts/btcpay-local-doctor.mjs "${RUNNER_TEMP}/btcpayserver"
      - name: Initialize synthetic Apex test receipt and status schema in disposable PostgreSQL
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/payout-rls/bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029233701_apex_initial_catalog_readonly.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030222500_payout_reporting_readonly.sql
          psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_receipt_journal_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_btcpay_test_order_status_REVIEW_ONLY.sql
      - name: Start upstream Bitcoin Core, NBXplorer and PostgreSQL (regtest only)
        working-directory: ${{ runner.temp }}/btcpayserver/BTCPayServer.Tests
        run: |
          docker compose up -d bitcoind nbxplorer postgres
      - name: Independently verify actual Bitcoin Core reports regtest
        working-directory: ${{ runner.temp }}/btcpayserver/BTCPayServer.Tests
        run: |
          set -euo pipefail
          verified=0
          for i in $(seq 1 90); do
            if docker compose exec -T bitcoind bitcoin-cli -datadir=/data -regtest getblockchaininfo >"${RUNNER_TEMP}/chain.json" 2>/dev/null; then
              if jq -e '.chain == "regtest"' "${RUNNER_TEMP}/chain.json" >/dev/null; then
                verified=1
                break
              else
                echo "::error::Connected chain was not regtest"
                exit 1
              fi
            fi
            sleep 2
          done
          test "$verified" = "1" || { echo "::error::Bitcoin regtest node did not become ready"; exit 1; }
          echo "Verified Bitcoin Core chain: regtest; no real funds"
      - name: Download pinned published Prism plugin (CI test only)
        env:
          APEX_BTCPAY_EPHEMERAL: "true"
          APEX_BTCPAY_TEST_NETWORK: regtest
        run: |
          set -euo pipefail
          # Published release from official BTCPay Plugin Builder over HTTPS.
          # Prefer the published archive. A fallback checks out EXACT source SHA
          # linked from the official Prism 1.3.3 listing; it is not binary-equal.
          if curl --fail --location --silent --show-error \
            --ipv4 --connect-timeout 15 --max-time 90 \
            --retry 4 --retry-all-errors --retry-delay 8 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            'https://plugin-builder.btcpayserver.org/api/v1/plugins/%5BBTCPayServer.Plugins.Prism%5D/versions/1.3.3.0/download' \
            -o "${RUNNER_TEMP}/prism-1.3.3.0.btcpay"; then
            printf '%s  %s\n' \
              '851f1c629ed40c398f9e0f383f2e6ca5b17f8572b9a158bd109625139d95e681' \
              "${RUNNER_TEMP}/prism-1.3.3.0.btcpay" | sha256sum --check --status
            python3 scripts/install_prism_regtest.py \
              "${RUNNER_TEMP}/prism-1.3.3.0.btcpay" \
              "${RUNNER_TEMP}/apex-prism-plugins/BTCPayServer.Plugins.Prism"
            echo "Prism source: official published archive SHA256 verified"
          else
            echo "::warning::Plugin package host unavailable; build exact linked Prism 1.3.3 source only for disposable regtest"
            source_ref='2b951b6f696396c29ae58e8d5dea981e2c3a1092'
            git init "${RUNNER_TEMP}/prism-source"
            git -C "${RUNNER_TEMP}/prism-source" remote add origin https://github.com/Kukks/BTCPayServerPlugins.git
            git -C "${RUNNER_TEMP}/prism-source" fetch --depth 1 origin "${source_ref}"
            git -C "${RUNNER_TEMP}/prism-source" checkout --detach FETCH_HEAD
            test "$(git -C "${RUNNER_TEMP}/prism-source" rev-parse HEAD)" = "${source_ref}"
            project="${RUNNER_TEMP}/prism-source/Plugins/BTCPayServer.Plugins.Prism/BTCPayServer.Plugins.Prism.csproj"
            test -f "${project}"
            grep -Eq '<Version>1[.]3[.]3</Version>' "${project}"
            # Build in the canonical upstream BTCPay tree, not through a
            # symlinked ProjectReference: MSBuild incorrectly resolves some
            # restored dependencies under two different physical roots.
            source_project="${RUNNER_TEMP}/prism-source/Plugins/BTCPayServer.Plugins.Prism"
            compile_project="${RUNNER_TEMP}/btcpayserver/BTCPayServer.Plugins.Prism"
            test ! -e "${compile_project}"
            cp -a "${source_project}" "${compile_project}"
            project="${compile_project}/BTCPayServer.Plugins.Prism.csproj"
            python3 - "${project}" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          old = r"..\..\submodules\btcpayserver\BTCPayServer\BTCPayServer.csproj"
          new = r"..\BTCPayServer\BTCPayServer.csproj"
          data = p.read_text()
          assert data.count(old) == 1, "Unexpected Prism source project reference"
          p.write_text(data.replace(old, new))
          PY
            test -f "${RUNNER_TEMP}/btcpayserver/BTCPayServer/BTCPayServer.csproj"
            mkdir -p "${RUNNER_TEMP}/apex-prism-plugins/BTCPayServer.Plugins.Prism"
            # Source code from SHA is untouched; only disposable csproj path
            # is adapted for the already-pinned BTCPay tree.
            dotnet publish "${project}" --configuration Debug \
              --output "${RUNNER_TEMP}/apex-prism-plugins/BTCPayServer.Plugins.Prism" \
              --property:UseAppHost=false
            echo "Prism source: linked source SHA ${source_ref}; locally built in disposable CI, not published archive"
          fi
          test -s "${RUNNER_TEMP}/apex-prism-plugins/BTCPayServer.Plugins.Prism/BTCPayServer.Plugins.Prism.dll"
      - name: Verify Prism package safety unit tests
        env:
          APEX_BTCPAY_EPHEMERAL: "true"
          APEX_BTCPAY_TEST_NETWORK: regtest
        run: python3 tests/prism-install-safety.test.py -v
      - name: Start official BTCPay Server on loopback-only development profile
        env:
          # Disposable runner only; keep SSRF protection enabled and narrowly
          # permit only the temporary local callback port, not all private IPs.
          BTCPAY_SSRFEXCEPTIONS: "127.0.0.1:48173"
          BTCPAY_PLUGINDIR: ${{ runner.temp }}/apex-prism-plugins
        working-directory: ${{ runner.temp }}/btcpayserver
        run: |
          set -euo pipefail
          # No bind to public network, no API tokens or any production environment variables.
          nohup dotnet run --project BTCPayServer/BTCPayServer.csproj --launch-profile Bitcoin >"${RUNNER_TEMP}/btcpay-boot.log" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/btcpay-boot.pid"
      - name: Check actual BTCPay server responds to HTTP on local runner only
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 120); do
            if curl --silent --show-error --location --max-redirs 2 --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:14142/ 2>/dev/null | grep -Eq '^(200|302|303)$'; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/btcpay-boot.pid")" 2>/dev/null; then
              echo "::error::BTCPay development process exited before HTTP readiness"
              exit 1
            fi
            sleep 5
          done
          test "$ready" = "1" || { echo "::error::BTCPay did not become ready at localhost:14142"; exit 1; }
          echo "Official BTCPay localhost startup verified on ephemeral regtest runner"
          echo "BTCPay HTTP readiness verified; signed invoice/webhook and actual Prism forwarding are verified in the final step"
      - name: Verify Prism route is installed in the disposable BTCPay server
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/apex-prism-plugins/BTCPayServer.Plugins.Prism/BTCPayServer.Plugins.Prism.dll"
          # Authenticated store form, expected redirect without a logged-in browser.
          result="$(curl --silent --output /dev/null --write-out '%{http_code}'             --max-time 8 http://127.0.0.1:14142/plugins/synthetic-test-store/prism)"
          if [[ "$result" != "302" && "$result" != "401" ]]; then
            echo "::error::Prism store configuration endpoint not registered (HTTP $result)"
            exit 1
          fi
          if grep -Eiq 'Error when loading plugin BTCPayServer.Plugins.Prism|Prism plugin.*disabled|Prism version does not match' "${RUNNER_TEMP}/btcpay-boot.log"; then
            echo "::error::Prism load failure found in BTCPay startup log"
            exit 1
          fi
          echo "Prism route registered and protected on isolated regtest runner"
      - name: Verify signed payment and real Prism-generated on-chain regtest forwarding
        env:
          APEX_BTCPAY_EPHEMERAL: "true"
          APEX_BTCPAY_TEST_NETWORK: regtest
          APEX_BTCPAY_PAY_REGTEST: "true"
          APEX_BTCPAY_VERIFY_WEBHOOK: "true"
          APEX_BTCPAY_DURABLE_TEST_JOURNAL: "true"
          APEX_BTCPAY_PRISM_FORWARDING: "true"
          BTCPAY_PLUGINDIR: ${{ runner.temp }}/apex-prism-plugins
          APEX_BTCPAY_WEBHOOK_PORT: "48173"
          APEX_BTCPAY_UPSTREAM_ROOT: ${{ runner.temp }}/btcpayserver
        run: node scripts/btcpay-ephemeral-greenfield.mjs
      - name: Stop ephemeral test processes and destroy disposable Bitcoin data
        if: always()
        working-directory: ${{ runner.temp }}/btcpayserver/BTCPayServer.Tests
        run: |
          if [ -f "${RUNNER_TEMP}/btcpay-boot.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/btcpay-boot.pid")" 2>/dev/null || true
          fi
          docker compose down --volumes --remove-orphans || true
          rm -f "${RUNNER_TEMP}/chain.json" "${RUNNER_TEMP}/btcpay-boot.log" "${RUNNER_TEMP}/btcpay-boot.pid"
          rm -rf "${RUNNER_TEMP}/apex-prism-plugins" "${RUNNER_TEMP}/prism-1.3.3.0.btcpay"
