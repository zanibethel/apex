name: Generate pinned auth lockfile
on:
  push:
    branches: [feat/supplier-auth-preview-2026-10-29]
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve exact dependency graph without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock exact Supabase Auth dependencies [lockfile generated]'
            git push
          fi
