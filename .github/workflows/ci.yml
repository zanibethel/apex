name: Apex quality checks
on:
  push:
    branches: [main, "docs/**", "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Guardrails
        run: npm run test
      - name: Typecheck privileged Supabase Edge image worker
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge worker
        run: deno check supabase/functions/apex-media-v1/index.ts
      - name: Build
        run: npm run build

  rls-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Test catalog SQL and tenant boundaries in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: apex_test
          PGPASSWORD: local_ci_only
        run: |
          psql -X -v ON_ERROR_STOP=1 -f database/tests/catalog_rls_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_operations_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_import_review_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_candidate_draft_promotion_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/product_media_promos_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/mobile_supplier_product_cards_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/draft_sku_edit_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/private_product_review_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/review_integrity_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_listing_admin_override_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/private_release_decision_engine_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/private_media_evidence_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/public_media_versions_v1_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/public_media_auto_revocation_v1_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/media_issue_and_resolve_v1_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_media_correction_feedback_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_hold_correction_roundtrip_integration.sql
          # Each command starts a fresh psql connection; verifies readback after commit.
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_batch_persistence_seed_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_batch_persistence_readback_integration.sql
          # New card toggles: reviewed DB changes in disposable PostgreSQL only.
          psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_simple_listing_controls_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/simple_card_listing_controls_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_supplier_corrections_resubmit_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/supplier_corrections_resubmission_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/sql/apex_private_source_one_click_drafts_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/private_source_one_click_drafts_integration.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/verified_only_sold_out_feed_integration.sql
          # New synthetic full workflow uses only disposable data in a rollback.
          psql -X -v ON_ERROR_STOP=1 -f database/tests/full_supplier_card_workflow_e2e.sql
          # Administrator off-platform review records; no release or checkout changes.
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261110123000_apex_admin_offline_product_reviews.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/admin_offline_product_review_integration.sql
